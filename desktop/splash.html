<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Academy Work Management</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      main {
        text-align: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Academy Work Management</h1>
      <p>Starting…</p>
    </main>
  </body>
</html>
